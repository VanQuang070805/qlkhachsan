server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/common.conf;

    # Block customer, admin, and internal tool namespaces on the staff portal
    location ~ ^/(admin|api/v1/customer|api/v1/public|api/v1/admin|internal/v1|chatbot)(/|$) {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass staff-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_PORTAL_CONTEXT staff;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }
}
