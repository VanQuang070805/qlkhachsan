server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/common.conf;

    # Block internal staff, admin, and internal tool namespaces on the customer portal
    location ~ ^/(staff|admin|receptionist|internalauth|api/v1/staff|api/v1/admin|internal/v1|api/chatbot/tools)(/|$) {
        return 403;
    }

    # SSE Chatbot Streaming (disable buffering & compression)
    location ~ ^/(chatbot/stream|api/v1/customer/chat/runs/[^/]+/events)$ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass customer-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param HTTP_X_PORTAL_CONTEXT customer;
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 120s;
        gzip off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass customer-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_PORTAL_CONTEXT customer;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }
}
