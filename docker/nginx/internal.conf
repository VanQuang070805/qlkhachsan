server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/common.conf;

    # Internal-web only serves internal chatbot tools, device API, and healthcheck
    location ~ ^/(internal/v1/chatbot/tools|api/chatbot/tools|devices/v1|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location / {
        return 403;
    }

    location ~ \.php$ {
        fastcgi_pass customer-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_PORTAL_CONTEXT internal;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }
}
