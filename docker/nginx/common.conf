charset utf-8;
client_max_body_size 8M;

# Block hidden files, .env, and source maps
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.map$ {
    deny all;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }
