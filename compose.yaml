name: royal-hotel-nhom10-v2

x-laravel-common-env: &laravel-common-env
  APP_NAME: ${APP_NAME:-Rosaliza Hotel}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
  DB_BOOTSTRAP_MODE: ${DB_BOOTSTRAP_MODE:-snapshot}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-qlkhachsan}
  DB_USERNAME: ${DB_USERNAME:-royal_app}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: lax
  SESSION_SECURE_COOKIE: "false"
  SESSION_DOMAIN: "null"
  CACHE_STORE: redis
  CACHE_PREFIX: ${CACHE_PREFIX:-royal-hotel-nhom10-v2}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis-cache
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_CONNECTION: queue
  REDIS_QUEUE_HOST: redis-queue
  REDIS_QUEUE_PORT: 6379
  REDIS_QUEUE_DB: 0
  REDIS_QUEUE: laravel-default
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-lite-latest}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  LANGGRAPH_ENABLED: "true"
  LANGGRAPH_BASE_URL: http://chatbot-api:2024
  LANGGRAPH_INTERNAL_API_KEY: ${LANGGRAPH_INTERNAL_API_KEY}
  LANGGRAPH_TIMEOUT: ${LANGGRAPH_TIMEOUT:-60}
  LANGGRAPH_RETRIEVAL_ASSISTANT_ID: retrieval_graph
  LANGGRAPH_INGESTION_ASSISTANT_ID: ingestion_graph
  LANGGRAPH_VECTOR_PROVIDER: mysql
  LANGGRAPH_TOOL_API_KEY: ${LANGGRAPH_TOOL_API_KEY}
  LANGGRAPH_LIVE_TOOLS_ENABLED: "true"
  LANGGRAPH_CAPABILITY_TTL: ${LANGGRAPH_CAPABILITY_TTL:-90}
  CUSTOMER_PORTAL_URL: ${CUSTOMER_PORTAL_URL:-http://localhost:18080}
  STAFF_PORTAL_URL: ${STAFF_PORTAL_URL:-http://localhost:18081}
  ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-http://localhost:18082}
  FACE_PC_SERVICE_URL: ${FACE_PC_SERVICE_URL:-http://host.docker.internal:8001}
  DEVICE_API_KEY: ${DEVICE_API_KEY:-}
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-royal-hotel-nhom10-v2}

x-chatbot-common-env: &chatbot-common-env
  NODE_ENV: production
  REQUIRE_INTERNAL_API_KEY: "true"
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-lite-latest}
  GEMINI_FALLBACK_CHAT_MODEL: ${GEMINI_FALLBACK_CHAT_MODEL:-gemini-3.1-flash-lite}
  GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-0}
  GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-20000}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  VECTOR_PROVIDER: mysql
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${DB_USERNAME:-royal_app}
  MYSQL_PASSWORD: ${DB_PASSWORD}
  MYSQL_DATABASE: ${DB_DATABASE:-qlkhachsan}
  REDIS_QUEUE_HOST: redis-queue
  REDIS_QUEUE_PORT: 6379
  REDIS_QUEUE_DB: 0
  USE_BULLMQ_WORKER: "true"
  CHATBOT_WORKER_CONCURRENCY: ${CHATBOT_WORKER_CONCURRENCY:-2}
  LARAVEL_INTERNAL_API_URL: http://internal-web/internal/v1
  LARAVEL_TOOL_API_KEY: ${LANGGRAPH_TOOL_API_KEY}
  LANGGRAPH_HOST: 0.0.0.0
  LANGGRAPH_PORT: 2024
  LANGGRAPH_INTERNAL_API_KEY: ${LANGGRAPH_INTERNAL_API_KEY}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
  LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-royal-hotel-chatbot-docker}
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-royal-hotel-nhom10-v2}

services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-qlkhachsan}
      MYSQL_USER: ${DB_USERNAME:-royal_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-royal_app}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    expose:
      - "6379"
    volumes:
      - ./docker/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    expose:
      - "6379"
    volumes:
      - ./docker/redis/queue.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_queue_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-init:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: app-init
      PORTAL_CONTEXT: all
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - backend_net

  customer-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: customer-app
      PORTAL_CONTEXT: customer
      APP_URL: ${CUSTOMER_PORTAL_URL:-http://localhost:18080}
      SESSION_COOKIE: royal_customer_session
    expose:
      - "9000"
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_public:/var/www/html/public
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - frontend_net
      - backend_net

  staff-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: staff-app
      PORTAL_CONTEXT: staff
      APP_URL: ${STAFF_PORTAL_URL:-http://localhost:18081}
      SESSION_COOKIE: royal_staff_session
    expose:
      - "9000"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - frontend_net
      - backend_net

  admin-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: admin-app
      PORTAL_CONTEXT: admin
      APP_URL: ${ADMIN_PORTAL_URL:-http://localhost:18082}
      SESSION_COOKIE: royal_admin_session
    expose:
      - "9000"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - frontend_net
      - backend_net

  customer-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CUSTOMER_PORT:-18080}:80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - ./docker/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./docker/nginx/customer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer-app
    networks:
      - frontend_net

  staff-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${STAFF_PORT:-18081}:80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - ./docker/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./docker/nginx/staff.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - staff-app
    networks:
      - frontend_net

  admin-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-18082}:80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - ./docker/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./docker/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-app
    networks:
      - frontend_net

  internal-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - ./docker/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./docker/nginx/internal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer-app
    networks:
      - backend_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: scheduler
      PORTAL_CONTEXT: all
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - backend_net

  laravel-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=laravel-default", "--sleep=3", "--tries=3"]
    environment:
      <<: *laravel-common-env
      CONTAINER_ROLE: laravel-worker
      PORTAL_CONTEXT: all
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - backend_net

  chatbot-init:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    restart: "no"
    command: ["node", "dist/src/scripts/sync-knowledge.js"]
    environment:
      <<: *chatbot-common-env
    depends_on:
      app-init:
        condition: service_completed_successfully
    networks:
      - backend_net

  chatbot-api:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/server.js"]
    environment:
      <<: *chatbot-common-env
    expose:
      - "2024"
    depends_on:
      chatbot-init:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      internal-web:
        condition: service_started
    networks:
      - backend_net

  chatbot-worker:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *chatbot-common-env
    depends_on:
      chatbot-init:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      internal-web:
        condition: service_started
    networks:
      - backend_net

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-init:
    image: apache/kafka:3.8.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.chatbot.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.hotel.catalog.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.security.audit.v1 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend_net

  event-relay:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/scripts/event-relay.js"]
    environment:
      <<: *chatbot-common-env
    depends_on:
      app-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend_net

  event-consumer:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/scripts/event-consumer.js"]
    environment:
      <<: *chatbot-common-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  redis_queue_data:
  kafka_data:
  laravel_storage:
  laravel_public:
