<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="vqrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f5fc"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#vqrBg)" stroke="#dbe7f5" stroke-width="1"/>
  <!-- Top QR corner finder - Top-left -->
  <rect x="9" y="10" width="12" height="12" rx="2.5" fill="none" stroke="#0054a6" stroke-width="2.5"/>
  <rect x="13" y="14" width="4" height="4" rx="1" fill="#0054a6"/>
  <!-- Top QR corner finder - Top-right -->
  <rect x="27" y="10" width="12" height="12" rx="2.5" fill="none" stroke="#ed1c24" stroke-width="2.5"/>
  <rect x="31" y="14" width="4" height="4" rx="1" fill="#ed1c24"/>
  <!-- Bottom QR corner finder - Bottom-left -->
  <rect x="9" y="26" width="12" height="12" rx="2.5" fill="none" stroke="#0054a6" stroke-width="2.5"/>
  <rect x="13" y="30" width="4" height="4" rx="1" fill="#0054a6"/>
  <!-- VietQR Red Accent & QR Data dots -->
  <rect x="25" y="26" width="4" height="4" rx="1" fill="#ed1c24"/>
  <rect x="33" y="26" width="6" height="4" rx="1" fill="#0054a6"/>
  <rect x="25" y="34" width="6" height="4" rx="1" fill="#0054a6"/>
