<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="cashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#cashBg)"/>
  <!-- Banknote outer border -->
  <rect x="8" y="14" width="32" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Central currency circle with star/dot -->
  <circle cx="24" cy="24" r="5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="24" cy="24" r="2" fill="#ffffff"/>
  <!-- Decorative corner elements -->
  <circle cx="12" cy="18" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="36" cy="18" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="12" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="36" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Sub-bill shadow underneath -->
  <path d="M11 36h26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
