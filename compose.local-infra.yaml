name: rosaliza-local-infra

x-laravel-env: &laravel-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: qlkhachsan
  DB_USERNAME: root
  DB_PASSWORD: ""
  REDIS_CLIENT: predis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis-cache
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_CONNECTION: queue
  REDIS_QUEUE_HOST: redis-queue
  REDIS_QUEUE_PORT: 6379
  REDIS_QUEUE_DB: 0
  REDIS_QUEUE: laravel-default
  LANGGRAPH_ENABLED: "true"
  LANGGRAPH_BASE_URL: http://chatbot-api:2024
  KAFKA_BROKERS: kafka:9092
  PHP_CLI_SERVER_WORKERS: 4

x-laravel-volumes: &laravel-volumes
  - .:/var/www/html
  - vendor_cache:/var/www/html/vendor

x-chatbot-env: &chatbot-env
  VECTOR_PROVIDER: mysql
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: ""
  MYSQL_DATABASE: qlkhachsan
  REDIS_QUEUE_HOST: redis-queue
  REDIS_QUEUE_PORT: 6379
  REDIS_QUEUE_DB: 0
  USE_BULLMQ_WORKER: "true"
  CHATBOT_WORKER_CONCURRENCY: 2
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: rosaliza-local
  LARAVEL_INTERNAL_API_URL: http://internal-api:18084/api
  LANGGRAPH_HOST: 0.0.0.0
  LANGGRAPH_PORT: 2024

x-chatbot-volumes: &chatbot-volumes
  - ./services/royal-ai-chatbot:/workspace
  - ./resources/knowledge:/workspace/resources/knowledge:ro

services:
  mysql:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: qlkhachsan
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./docker/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-queue:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - ./docker/redis/queue.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  kafka-init:
    image: apache/kafka:3.8.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.chatbot.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.hotel.catalog.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic royal.security.audit.v1 --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  customer-portal:
    image: rosaliza-local-php:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile.local
    restart: unless-stopped
    command: ["php", "-d", "variables_order=EGPCS", "-S", "0.0.0.0:18080", "-t", "public", "docker/scripts/portal-router.php"]
    ports:
      - "127.0.0.1:18080:18080"
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: customer-portal
      PORTAL_CONTEXT: customer
      APP_URL: http://127.0.0.1:18080
      SESSION_COOKIE: royal_customer_session
    volumes: *laravel-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  staff-portal:
    image: rosaliza-local-php:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "-d", "variables_order=EGPCS", "-S", "0.0.0.0:18081", "-t", "public", "docker/scripts/portal-router.php"]
    ports:
      - "127.0.0.1:18081:18081"
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: staff-portal
      PORTAL_CONTEXT: staff
      APP_URL: http://127.0.0.1:18081
      SESSION_COOKIE: royal_staff_session
    volumes: *laravel-volumes
    depends_on:
      customer-portal:
        condition: service_started

  admin-portal:
    image: rosaliza-local-php:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "-d", "variables_order=EGPCS", "-S", "0.0.0.0:18082", "-t", "public", "docker/scripts/portal-router.php"]
    ports:
      - "127.0.0.1:18082:18082"
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: admin-portal
      PORTAL_CONTEXT: admin
      APP_URL: http://127.0.0.1:18082
      SESSION_COOKIE: royal_admin_session
    volumes: *laravel-volumes
    depends_on:
      customer-portal:
        condition: service_started

  internal-api:
    image: rosaliza-local-php:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "-d", "variables_order=EGPCS", "-S", "0.0.0.0:18084", "-t", "public", "docker/scripts/portal-router.php"]
    ports:
      - "127.0.0.1:18084:18084"
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: internal-api
      PORTAL_CONTEXT: internal
      APP_URL: http://127.0.0.1:18084
    volumes: *laravel-volumes
    depends_on:
      customer-portal:
        condition: service_started

  laravel-worker:
    image: rosaliza-local-php:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=laravel-default", "--sleep=3", "--tries=3", "--timeout=60"]
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: laravel-worker
      PORTAL_CONTEXT: all
    volumes: *laravel-volumes
    depends_on:
      customer-portal:
        condition: service_started

  laravel-scheduler:
    image: rosaliza-local-php:latest
    pull_policy: never
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: laravel-scheduler
      PORTAL_CONTEXT: all
    volumes: *laravel-volumes
    depends_on:
      customer-portal:
        condition: service_started

  chatbot-api:
    image: rosaliza-local-php:latest
    pull_policy: never
    working_dir: /workspace/backend
    restart: unless-stopped
    command: ["node", "dist/src/server.js"]
    ports:
      - "127.0.0.1:2024:2024"
    env_file:
      - ./services/royal-ai-chatbot/backend/.env
    environment:
      <<: *chatbot-env
    volumes: *chatbot-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      internal-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:2024/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  chatbot-worker:
    image: rosaliza-local-php:latest
    pull_policy: never
    working_dir: /workspace/backend
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - ./services/royal-ai-chatbot/backend/.env
    environment:
      <<: *chatbot-env
    volumes: *chatbot-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      internal-api:
        condition: service_started

  chatbot-kafka-relay:
    image: rosaliza-local-php:latest
    pull_policy: never
    working_dir: /workspace/backend
    restart: unless-stopped
    command: ["node", "dist/src/scripts/event-relay.js"]
    env_file:
      - ./services/royal-ai-chatbot/backend/.env
    environment:
      <<: *chatbot-env
    volumes: *chatbot-volumes
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  chatbot-kafka-consumer:
    image: rosaliza-local-php:latest
    pull_policy: never
    working_dir: /workspace/backend
    restart: unless-stopped
    command: ["node", "dist/src/scripts/event-consumer.js"]
    env_file:
      - ./services/royal-ai-chatbot/backend/.env
    environment:
      <<: *chatbot-env
    volumes: *chatbot-volumes
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_queue_data:
  kafka_data:
  vendor_cache:
