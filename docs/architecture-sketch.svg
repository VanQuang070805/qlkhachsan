  <text x="777" y="199" text-anchor="middle" class="hand group">Rosaliza Hotel Application</text>
  <text x="777" y="226" text-anchor="middle" class="hand small">Laravel serves the UI, business logic, and APIs in one system</text>

  <!-- Browser interface -->
  <path d="M346 264 Q348 247 365 247 L535 249 Q551 250 551 267 L550 683 Q549 700 533 701 L364 700 Q347 699 347 681 Z" class="inner path"/>
  <text x="449" y="288" text-anchor="middle" class="hand section">Web interface</text>
  <path d="M379 318 L518 318 L518 395 Q518 406 508 406 L389 406 Q378 406 378 395 Z" fill="#f1f7fd" stroke="#6695bb" stroke-width="2.3"/>
  <path d="M379 335 Q446 331 518 335" class="path" stroke="#6695bb" stroke-width="2"/>
  <circle cx="391" cy="326" r="3.5" fill="#d7726c"/><circle cx="403" cy="326" r="3.5" fill="#e0bb58"/><circle cx="415" cy="326" r="3.5" fill="#5fb376"/>
