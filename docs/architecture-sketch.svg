  <text x="369" y="460" class="hand item">Guests</text>
  <text x="369" y="487" class="hand small">Search and book</text>
  <path d="M368 511 Q447 514 530 510" class="divider"/>
  <text x="369" y="549" class="hand item">Staff</text>
  <text x="369" y="576" class="hand small">Check-in / checkout</text>
  <path d="M368 600 Q447 604 530 599" class="divider"/>
  <text x="369" y="640" class="hand item">Admins</text>
  <text x="369" y="667" class="hand small">Rooms, roles, reports</text>

  <!-- Web routes -->
  <path d="M583 263 Q587 248 603 248 L861 249 Q877 251 877 268 L876 699 Q874 716 858 716 L602 715 Q585 714 584 698 Z" class="inner path"/>
  <text x="730" y="288" text-anchor="middle" class="hand section">Web routes</text>
  <text x="730" y="313" text-anchor="middle" class="hand small">HTML · JSON · access</text>
  <path d="M602 329 Q729 332 857 329" class="divider"/>
  <text x="605" y="357" class="hand item">Room search</text>
  <text x="605" y="383" class="route">GET /rooms/search</text>
  <path d="M602 399 Q729 402 857 399" class="divider"/>
  <text x="605" y="427" class="hand item">Booking</text>
  <text x="605" y="453" class="route">POST /booking</text>
  <path d="M602 469 Q729 472 857 469" class="divider"/>
  <text x="605" y="497" class="hand item">Payment / chatbot</text>
  <text x="605" y="523" class="route">GET /payment/check/{id}</text>
  <text x="605" y="548" class="route">POST /chatbot/api</text>
  <path d="M602 566 Q729 569 857 566" class="divider"/>
  <text x="605" y="594" class="hand item">Operations / admin</text>
  <text x="605" y="620" class="route">/staff/*  ·  /admin/*</text>
  <path d="M602 639 Q729 642 857 639" class="divider"/>
  <text x="605" y="667" class="hand small">Server-side access checks</text>

  <!-- API routes -->
  <path d="M908 263 Q912 248 928 248 L1187 249 Q1202 251 1202 268 L1201 699 Q1199 716 1184 716 L927 715 Q910 714 909 698 Z" class="inner path"/>
