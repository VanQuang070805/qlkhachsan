  <text x="1055" y="313" text-anchor="middle" class="hand small">Under /api</text>
  <path d="M927 335 Q931 327 943 328 L1168 329 Q1181 330 1182 343 L1181 439 Q1179 449 1167 449 L942 448 Q930 447 928 437 Z" fill="#fff9f2" stroke="#dcab7a" stroke-width="2"/>
