  <text x="1346" y="491" class="hand small">Google OAuth · SMTP</text>
  <text x="1346" y="518" class="hand tiny">Federated sign-in · confirmation mail</text>
  <path d="M1321 572 Q1324 561 1338 561 L1725 563 Q1739 565 1740 579 L1739 677 Q1737 691 1722 691 L1337 690 Q1323 688 1322 675 Z" fill="#fffefa" stroke="#d8a676" stroke-width="2"/>
  <text x="1346" y="601" class="hand section">Dify Chatflow</text>
  <text x="1346" y="632" class="hand small">Chatbot calls room lookup tools</text>
  <text x="1346" y="659" class="hand tiny">Public room data only</text>
  <path d="M1321 725 Q1324 714 1338 714 L1725 716 Q1739 718 1740 732 L1739 861 Q1737 875 1722 875 L1337 874 Q1323 872 1322 859 Z" fill="#fffefa" stroke="#d8a676" stroke-width="2"/>
  <text x="1346" y="754" class="hand section">Devices and Face ID</text>
  <text x="1346" y="786" class="hand small">IoT sends cleaning requests</text>
  <text x="1346" y="814" class="hand small">Face ID service syncs profiles</text>
  <text x="1346" y="844" class="hand tiny">Enabled by configuration</text>

