  <text x="947" y="514" class="route">/chatbot/tools/</text>
  <text x="947" y="539" class="route">room-types</text>
  <text x="947" y="563" class="route">rooms/search</text>
  <path d="M927 593 Q931 585 943 586 L1168 587 Q1181 588 1182 601 L1181 691 Q1179 702 1167 702 L942 701 Q930 700 928 689 Z" fill="#f8faf4" stroke="#9dbf8a" stroke-width="2"/>
  <text x="947" y="615" class="hand item">Device API</text>
  <text x="947" y="642" class="route">/iot/rooms/{room}/</text>
  <text x="947" y="667" class="route">cleaning-request</text>
  <text x="947" y="690" class="hand tiny">GET / POST · device key</text>

  <!-- Business logic, scheduler, and data -->
  <path d="M346 755 Q350 744 363 744 L533 745 Q550 747 551 760 L550 863 Q548 878 534 879 L363 878 Q347 876 347 861 Z" fill="#fffefa" stroke="#78a0be" stroke-width="2.2"/>
  <circle cx="386" cy="788" r="19" fill="none" stroke="#367ab1" stroke-width="2.4"/>
  <path d="M386 773 L386 789 L397 796" class="path" stroke="#367ab1" stroke-width="2.4"/>
  <text x="416" y="795" class="hand item">Scheduler</text>
  <text x="367" y="827" class="hand small">Expire holds</text>
  <text x="367" y="852" class="hand small">No-show · sync</text>
  <path d="M583 753 Q587 744 602 744 L1183 745 Q1199 747 1200 760 L1199 808 Q1197 824 1182 825 L602 824 Q586 822 584 806 Z" fill="#edf8f0" stroke="#71a986" stroke-width="2.3"/>
  <text x="892" y="776" text-anchor="middle" class="hand item">Shared business logic</text>
  <text x="892" y="804" text-anchor="middle" class="hand small">Auth · access control · availability · transactions</text>
  <path d="M779 846 Q783 834 893 832 Q1006 834 1011 846 L1011 902 Q1007 920 895 922 Q783 919 779 902 Z" fill="#fff0b9" stroke="#aa8a38" stroke-width="2.6"/>
