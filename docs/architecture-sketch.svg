<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1020" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Rosaliza Hotel website architecture</title>
  <desc id="diagram-desc">Hand-drawn overview of guest, staff, and admin users; the web interface; Laravel web and API routes; shared MySQL data; and payment, email, Dify, and IoT integrations.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 Q5 4 11 6.5 Q5 9 1 12" fill="none" stroke="#286db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="orange-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 Q5 4 11 6.5 Q5 9 1 12" fill="none" stroke="#b36b31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="green-arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 Q5 4 11 6.5 Q5 9 1 12" fill="none" stroke="#479566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .hand { font-family:'Comic Sans MS','Segoe Print','Trebuchet MS',sans-serif; fill:#272a2d; }
      .title { font-size:33px; font-weight:700; }
      .subtitle { font-size:18px; fill:#666a70; }
      .group { font-size:26px; font-weight:700; }
      .section { font-size:23px; font-weight:700; }
      .item { font-size:20px; font-weight:600; }
      .small { font-size:17px; fill:#5b6269; }
      .tiny { font-size:15px; fill:#626973; }
      .route { font-family:Consolas,'Courier New',monospace; font-size:17px; fill:#3b4855; }
      .path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .divider { fill:none; stroke:#cfd8df; stroke-width:1.7; stroke-linecap:round; }
      .inner { fill:#fffefa; stroke:#75a0c2; stroke-width:2.2; }
    </style>
  </defs>
  <rect width="1800" height="1020" fill="#fffefa"/>
  <text x="900" y="62" text-anchor="middle" class="hand title">Rosaliza Hotel · Website Architecture</text>
  <text x="900" y="95" text-anchor="middle" class="hand subtitle">One web application, shared data, and APIs for integrations</text>
  <path d="M606 112 Q900 118 1195 112" class="path" stroke="#dedbd4" stroke-width="2"/>

  <!-- Three user groups -->
  <path d="M32 168 C34 148 48 144 70 146 Q154 139 250 147 C268 149 277 161 277 181 L276 907 C274 929 260 935 240 934 Q152 941 64 934 C43 932 31 922 31 901 Z" fill="#fff9f5" class="path" stroke="#947063" stroke-width="3.2"/>
