  <text x="947" y="384" class="route">/webhook/momo</text>
  <text x="947" y="408" class="route">/webhook/zalopay</text>
  <text x="947" y="432" class="route">/webhook/vnpay</text>
  <path d="M927 466 Q931 458 943 459 L1168 460 Q1181 461 1182 474 L1181 566 Q1179 577 1167 577 L942 576 Q930 575 928 564 Z" fill="#f5f7ff" stroke="#879bc8" stroke-width="2"/>
